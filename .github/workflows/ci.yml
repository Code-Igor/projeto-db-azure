name: CI/CD

on:
  push:
    branches: ["main"]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version

      - name: Instalar Ruff
        run: python3 -m pip install ruff

      - name: Verificar código com Ruff
        run: python3 -m ruff check .

      - run: python3 -m py_compile function_app.py